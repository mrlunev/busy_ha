blueprint:
  name: BUSY Bar — Physical input runs an action
  author: BUSY
  description: >
    Use the BUSY Bar as a physical controller for Home Assistant. When you press
    a button or turn the rotary selector on the bar, run an action (activate a
    scene, toggle lights, start a script, …).

    The input is delivered over the bar's real-time WebSocket stream, so the
    automation reacts instantly. You pick the bar from a device dropdown, so it
    keeps working even if the bar is renamed.

    Examples: turn the selector to BUSY → set the office to "focus" lighting and
    enable Do-Not-Disturb; press START → activate a "meeting" scene.
  domain: automation
  homeassistant:
    min_version: "2024.6.0"
  input:
    bar:
      name: BUSY Bar
      description: Which bar to listen to.
      selector:
        device:
          integration: busybar
          multiple: false
    input_trigger:
      name: Physical input
      description: Which button press or selector position should run the action.
      default: start_pressed
      selector:
        select:
          options:
            - { label: "Button: OK pressed", value: ok_pressed }
            - { label: "Button: Back pressed", value: back_pressed }
            - { label: "Button: Start pressed", value: start_pressed }
            - { label: "Selector → BUSY", value: selector_busy }
            - { label: "Selector → Custom", value: selector_custom }
            - { label: "Selector → Off", value: selector_off }
            - { label: "Selector → Apps", value: selector_apps }
            - { label: "Selector → Settings", value: selector_settings }
            - { label: "Encoder rotated", value: encoder_rotated }
    action_to_run:
      name: Action
      description: What to do when the chosen input happens.
      selector:
        action:

mode: single
trigger:
  - platform: device
    domain: busybar
    device_id: !input bar
    type: !input input_trigger
action:
  - choose: []
    default: !input action_to_run
