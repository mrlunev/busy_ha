# --- Notifications (design templates) -------------------------------------
# Each template is its own action with its own fields. The text position is
# computed in code from the chosen icon size, so text and icon never overlap.

notify_one_line:
  target:
    device:
      integration: busybar
  fields:
    message:
      example: "Laundry done!"
      selector:
        text:
    icon:
      default: none
      example: check
      selector:
        select:
          mode: dropdown
          options:
            - none
            - check
            - error
            - info
            - clock
            - hourglass
            - low_battery
            - start
            - setup
            # Draw Tool icon set (16x16 color, firmware FW-984 / r835+)
            - apple_green
            - apple_red
            - apple_yellow
            - available
            - unavailable
            - basketball
            - football
            - tennis
            - book
            - study
            - work
            - home
            - leaf
            - burger
            - chicken
            - pizza
            - pizza_margarita
            - pizza_peperoni
            - pie
            - toast
            - tomato
            - coffee
            - tea
            - coctail
            - drink_1
            - drink_2
            - dialog
            - dialog_yes
            - dialog_no
            - "yes"
            - "no"
            - crescent_moon_1
            - crescent_moon_2
            - moon_1
            - moon_2
            - sparkls_1
            - sparkls_2
            - heart_red
            - heart_pink
            - heart_orange
            - heart_yellow
            - heart_green
            - heart_blue
            - heart_light_blue
            - heart_violet
            - emoji_happy
            - emoji_grinning
            - emoji_laught
            - emoji_heart_eyes
            - emoji_relief
            - emoji_glasses
            - emoji_tounge
            - emoji_sweat_smile
            - emoji_awkward
            - emoji_expressionless
            - emoji_eyes
            - emoji_surprised
            - emoji_sad
            - emoji_cry
            - emoji_fatigue
            - emoji_sleep
            - emoji_melted
            - emoji_angry
            - emoji_evil
            - emoji_panic
            - emoji_dead
    sound:
      default: none
      selector:
        select:
          options:
            - none
            - event
            - reminder
            - volume
    duration:
      default: 10
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: seconds
    interrupt:
      default: false
      selector:
        boolean:
    appearance:
      collapsed: true
      fields:
        font:
          default: small
          selector:
            select:
              mode: dropdown
              options:
                - tiny
                - small
                - normal
                - condensed
                - bold
                - large
                - extra_large
        color:
          example: [255, 255, 255]
          selector:
            color_rgb:
        background_color:
          example: [0, 0, 0]
          selector:
            color_rgb:

