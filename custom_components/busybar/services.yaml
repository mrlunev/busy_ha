simple_timer:
  target:
    device:
      integration: busybar
  fields:
    hours:
      default: 0
      selector:
        number:
          min: 0
          max: 23
          unit_of_measurement: h
    minutes:
      default: 5
      selector:
        number:
          min: 0
          max: 59
          unit_of_measurement: min
    seconds:
      default: 0
      selector:
        number:
          min: 0
          max: 59
          unit_of_measurement: s
    color:
      example: [255, 255, 255]
      selector:
        color_rgb:
    sound:
      default: event
      selector:
        select:
          options:
            - none
            - event
            - reminder
            - volume
    interrupt:
      default: false
      selector:
        boolean:

start_timer:
  target:
    device:
      integration: busybar
  fields:
    mode:
      default: infinite
      selector:
        select:
          options:
            - infinite
            - simple
            - pomodoro
    theme:
      default: meeting
      selector:
        select:
          options:
            - meeting
            - dnd
            - on_call
            - on_air
            - flow
            - lunch
            - back_soon
            - booked
            - chill_time
            - keep_out
            - busy
    work:
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: minutes
    rest:
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: minutes
    cycles:
      selector:
        number:
          min: 1
          max: 20

set_theme:
  target:
    device:
      integration: busybar
  fields:
    theme:
      required: true
      selector:
        select:
          options:
            - meeting
            - dnd
            - on_call
            - on_air
            - flow
            - lunch
            - back_soon
            - booked
            - chill_time
            - keep_out
            - busy

play_sound:
  target:
    device:
      integration: busybar
  fields:
    sound:
      required: true
      example: event
      selector:
        select:
          options:
            - event
            - reminder
            - volume

clear:
  target:
    device: {}

stop_timer:
  target:
    device: {}

pause_timer:
  target:
    device: {}

resume_timer:
  target:
    device: {}
