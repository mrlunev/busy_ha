simple_timer:
  target:
    device:
      integration: busybar
  fields:
    hours:
      default: 0
      selector:
        number:
          min: 0
          max: 23
          unit_of_measurement: h
    minutes:
      default: 5
      selector:
        number:
          min: 0
          max: 59
          unit_of_measurement: min
    seconds:
      default: 0
      selector:
        number:
          min: 0
          max: 59
          unit_of_measurement: s
    color:
      example: [255, 255, 255]
      selector:
        color_rgb:
    sound:
      default: event
      selector:
        select:
          options:
            - none
            - event
            - reminder
            - volume
    interrupt:
      default: false
      selector:
        boolean:

start_timer:
  target:
    device:
      integration: busybar
  fields:
    mode:
      default: infinite
      selector:
        select:
          options:
            - infinite
            - countdown
            - pomodoro
    theme:
      default: meeting
      selector:
        select:
          options:
            - meeting
            - dnd
            - on_call
            - on_air
            - flow
            - lunch
            - back_soon
            - booked
            - chill_time
            - keep_out
            - busy
    duration:
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: minutes
    work_minutes:
      default: 25
      selector:
        number:
          min: 1
          max: 180
          unit_of_measurement: minutes
    break_minutes:
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: minutes
    cycles:
      default: 4
      selector:
        number:
          min: 1
          max: 20

start_profile:
  target:
    device:
      integration: busybar
  fields:
    slot:
      required: true
      example: busy
      selector:
        select:
          options:
            - busy
            - custom

set_theme:
  target:
    device:
      integration: busybar
  fields:
