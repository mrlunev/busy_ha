play_sound:
  target:
    device:
      integration: busybar
  fields:
    sound:
      required: true
      example: event
      selector:
        select:
          options:
            - event
            - reminder
            - volume

clear:
  target:
    device: {}

stop_timer:
  target:
    device: {}

pause_timer:
  target:
    device: {}

resume_timer:
  target:
    device: {}
