# --- Notifications (design templates) -------------------------------------
# Each template is its own action with its own fields. The text position is
# computed in code from the chosen icon size, so text and icon never overlap.

notify_one_line:
  target:
    device:
      integration: busybar
  fields:
    message:
      example: "Laundry done!"
      selector:
        text:
    icon:
      default: none
      example: check
      selector:
        select:
          options:
            - none
            - check
            - error
            - info
            - clock
            - hourglass
            - low_battery
            - start
            - setup
    sound:
      default: none
      selector:
        select:
          options:
            - none
            - event
            - reminder
            - volume
    duration:
      default: 10
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: seconds
    interrupt:
      default: false
      selector:
        boolean:
    appearance:
      collapsed: true
      fields:
        font:
          default: small
          selector:
            select:
              mode: dropdown
              options:
                - tiny
                - small
                - normal
                - condensed
                - bold
                - large
                - extra_large
        color:
          example: [255, 255, 255]
          selector:
            color_rgb:
        background_color:
          example: [0, 0, 0]
          selector:
            color_rgb:

