rules:
  # ------------------------------------------------------------------ Bronze
  config-flow: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
  config-flow-test-coverage:
    status: done
    comment: >-
      config_flow at 96% (user/no-token/unsupported/errors/already-configured,
      dhcp success/self-heal/cannot-connect/password-protected/confirm-errors,
      reauth success/invalid-auth/wrong-device). See tests/test_config_flow.py.
  runtime-data: done
  entity-unique-id: done
  has-entity-name: done
  entity-event-setup: done
  appropriate-polling:
    status: done
    comment: >-
      Tiered single coordinator at a 30s base. Countdown is a timestamp sensor
      ticked by the frontend, so no fast poll is needed for it. Rarely-changing
      endpoints are fetched on slower multiples (60s/5min); user writes force a
      full refresh. Sustained rate ~0.17 req/s/device (was ~1.8).
  common-modules: done
  action-setup: done
  dependency-transparency:
    status: todo
    comment: >-
      API client is bundled in api.py. Must be extracted to a published PyPI
      package and added to manifest requirements before core submission.
  docs-high-level-description:
    status: todo
    comment: README covers it; home-assistant.io docs PR pending.
  docs-installation-instructions:
    status: todo
    comment: README covers it; home-assistant.io docs PR pending.
  docs-removal-instructions:
    status: todo
    comment: README covers it; home-assistant.io docs PR pending.
  docs-actions:
    status: todo
    comment: services.yaml + README cover it; home-assistant.io docs PR pending.
  brands:
    status: done
    comment: >-
      Local brand/icon.png + icon@2x.png served via the brands proxy API
      (HA 2026.3+); live-verified. home-assistant/brands core_integrations PR
      still needed at core-submission time.

  # ------------------------------------------------------------------ Silver
  action-exceptions: done
  config-entry-unloading: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: >-
      98% line coverage (84 tests) measured locally with
      pytest-homeassistant-custom-component on HA 2026.2.3 / Python 3.13.
  docs-configuration-parameters:
    status: todo
    comment: home-assistant.io docs PR pending.
  docs-installation-parameters:
    status: todo
    comment: home-assistant.io docs PR pending.

  # ------------------------------------------------------------------ Gold
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  devices: done
  diagnostics: done
  discovery:
    status: done
    comment: DHCP discovery by WiFi OUI (manifest dhcp 8C8B48*); live-verified.
  discovery-update-info:
    status: done
    comment: DHCP hit self-heals the stored host on IP change (config_flow).
  reconfiguration-flow:
    status: done
    comment: async_step_reconfigure changes host/token; serial mismatch aborts wrong_device.
  repair-issues:
    status: todo
  exception-translations:
    status: done
    comment: User-facing HomeAssistantError/ServiceValidationError use translation_key; messages in strings.json exceptions block.
  icon-translations:
    status: todo
  docs-data-update:
    status: todo
  docs-examples:
    status: todo
  docs-known-limitations:
    status: todo
  docs-supported-devices:
    status: todo
  docs-supported-functions:
    status: todo
  docs-troubleshooting:
    status: todo
  docs-use-cases:
    status: todo
  dynamic-devices:
    status: exempt
    comment: One physical device per config entry; no dynamic sub-devices.
  stale-devices:
    status: exempt
    comment: One physical device per config entry; removed by deleting the entry.

  # --------------------------------------------------------------- Platinum
  async-dependency:
    status: todo
    comment: Pending PyPI client extraction.
  inject-websession: done
  strict-typing:
    status: todo
